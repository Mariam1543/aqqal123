<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  /* product.html has its own stylesheet: light, for print. */
  :root {
    --ink:#101720; --ink-2:#333f4d; --mute:#5c6772; --hair:#d3d9e0;
    --sans:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 400 12.5px/1.55 var(--sans);
         font-variant-numeric: tabular-nums; }
  .band { background: #8f2519; color: #fff; text-align: center; font: 600 10.5px/1 var(--sans);
          text-transform: uppercase; letter-spacing: .09em; padding: 6px 8px;
          print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .page { max-width: 760px; margin: 0 auto; padding: 22px 30px 40px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 18px; }
  .eyebrow { font: 500 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--mute); }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; margin: 6px 0 4px; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--mute); }
  section { margin-bottom: 18px; break-inside: avoid; page-break-inside: avoid; }
  h2 { font: 500 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em;
       color: var(--mute); margin-bottom: 6px; }
  p { margin: 0 0 8px; }
  ul { margin: 0 0 8px; padding-left: 18px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--hair);
           vertical-align: baseline; font-size: 12px; }
  thead th { font: 500 10px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em;
             color: var(--mute); border-bottom: 1px solid var(--ink); }
  tbody th { width: 34%; color: var(--mute); font-weight: 400; }
  td:not(:first-child) { font-family: var(--mono); }
  em { color: var(--mute); font-style: normal; font-size: 10.5px; }
  @page { margin: 14mm; }
  @media print { .band { position: static; } body { font-size: 11.5px; } }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="page" id="doc"></div>
  <div class="band"></div>
  <script type="module" src="/js/product.js"></script>
</body>
</html>
